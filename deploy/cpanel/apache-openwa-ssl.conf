# WHM/cPanel SERVER WITH ROOT: reverse proxy for subdomain wa.example.com -> OpenWA on 127.0.0.1:2785
#
# Install path (survives cPanel rebuilds; EasyApache 4, Apache 2.4):
#   /etc/apache2/conf.d/userdata/ssl/2_4/CPANELUSER/wa.example.com/openwa.conf     (HTTPS vhost)
#   /etc/apache2/conf.d/userdata/std/2_4/CPANELUSER/wa.example.com/openwa.conf     (HTTP vhost, optional)
# Then:   /usr/local/cpanel/scripts/rebuildhttpdconf && /usr/local/cpanel/scripts/restartsrv_httpd
#
# Prerequisites (WHM > EasyApache 4 > Customize > Apache Modules):
#   mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers   (WebSocket needs wstunnel)
# Replace CPANELUSER and wa.example.com. ssl vhost = the file in .../ssl/..., std vhost optional.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# Socket.IO / WebSocket traffic first
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/(.*)$ ws://127.0.0.1:2785/$1 [P,L]

# Everything else
ProxyPass        / http://127.0.0.1:2785/ timeout=300 keepalive=On
ProxyPassReverse / http://127.0.0.1:2785/

# Big media uploads (bytes). 0 = unlimited; match OpenWA BODY_SIZE_LIMIT (25 MB).
LimitRequestBody 26214400
