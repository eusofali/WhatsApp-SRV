# /etc/nginx/sites-available/openwa.conf   (then: ln -s into sites-enabled, nginx -t, reload)
# Replace wa.example.com. Get the certificate first:  certbot --nginx -d wa.example.com
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name wa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wa.example.com;

    ssl_certificate     /etc/letsencrypt/live/wa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.example.com/privkey.pem;

    # Must be >= OpenWA BODY_SIZE_LIMIT (25mb) or media sends get nginx's own 413.
    client_max_body_size 25m;

    # Optional extra layer: only your office/app IPs may reach the dashboard + API.
    # allow 203.0.113.10; deny all;

    location / {
        proxy_pass http://127.0.0.1:2785;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # Socket.IO / WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
